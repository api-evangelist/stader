name: Stader
description: >-
  Stader Labs is a non-custodial, smart-contract-driven liquid-staking protocol
  that lets users stake crypto assets and earn rewards while retaining liquidity
  through liquid-staking tokens (ETHx, MaticX, BNBX, HBARX, NEARx) usable across
  40+ DeFi protocols. Stader operates across multiple chains — Ethereum, Polygon,
  BNB Chain, Hedera and NEAR — with open-source smart contracts and node tooling.
  Its developer surface is on-chain contracts, a Go node client (stader-node) and
  permissioned CLI, and public GitHub source rather than a hosted REST/OpenAPI API.
  This profile was surfaced as an Accel portfolio company and enriched by the API
  Evangelist pipeline; probes confirm no public HTTP API, well-known discovery, or
  llms.txt surface at this time.
